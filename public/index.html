<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholarAgent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Background animated grid -->
  <div class="bg-grid"></div>

  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
      </svg>
      <h1>ScholarAgent</h1>
    </div>
    <p class="subtitle">AI-Powered Scientific Discovery Engine</p>
  </header>

  <main>
    <!-- Search Section -->
    <section class="search-section" id="searchSection">
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="queryInput"
            placeholder="Enter a research topic..."
            autocomplete="off"
          />
          <button id="searchBtn" onclick="startResearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
          </button>
        </div>
        <div class="search-hints">
          <span class="hint" onclick="setQuery(this)">CRISPR gene therapy advances</span>
          <span class="hint" onclick="setQuery(this)">Quantum error correction 2025</span>
          <span class="hint" onclick="setQuery(this)">LLM reasoning capabilities</span>
        </div>
      </div>
    </section>

    <!-- Pipeline Visualization -->
    <section class="pipeline-section hidden" id="pipelineSection">
      <div class="pipeline">
        <div class="pipeline-node" id="node-supervisor" data-label="Supervisor">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z" />
            </svg>
          </div>
          <span class="node-label">Supervisor</span>
          <div class="node-status"></div>
        </div>

        <div class="pipeline-connector" id="conn-1"><div class="connector-line"></div></div>

        <div class="pipeline-node" id="node-scouts" data-label="Scouts">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
          </div>
          <span class="node-label">Scouts</span>
          <div class="node-status"></div>
        </div>

        <div class="pipeline-connector" id="conn-2"><div class="connector-line"></div></div>

        <div class="pipeline-node" id="node-citation_explorer" data-label="Citations">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
            </svg>
          </div>
          <span class="node-label">Citations</span>
          <div class="node-status"></div>
        </div>

        <div class="pipeline-connector" id="conn-3"><div class="connector-line"></div></div>

        <div class="pipeline-node" id="node-fetcher" data-label="Fetcher">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
          </div>
          <span class="node-label">Fetcher</span>
          <div class="node-status"></div>
        </div>

        <div class="pipeline-connector" id="conn-4"><div class="connector-line"></div></div>

        <div class="pipeline-node" id="node-analyst" data-label="Analyst">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5m.75-9l3-3 2.148 2.148A12.061 12.061 0 0116.5 7.605" />
            </svg>
          </div>
          <span class="node-label">Analyst</span>
          <div class="node-status"></div>
        </div>

        <div class="pipeline-connector" id="conn-5"><div class="connector-line"></div></div>

        <div class="pipeline-node" id="node-writer" data-label="Writer">
          <div class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
          </div>
          <span class="node-label">Writer</span>
          <div class="node-status"></div>
        </div>
      </div>

      <!-- Current stage label -->
      <div class="stage-label" id="stageLabel"></div>
    </section>

    <!-- Agent Detail Cards -->
    <section class="details-section" id="detailsSection"></section>

    <!-- Final Report -->
    <section class="report-section hidden" id="reportSection">
      <div class="report-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
        <h2>Research Report</h2>
      </div>
      <div class="report-content" id="reportContent"></div>
    </section>

    <!-- New Search Button (shown after completion) -->
    <div class="new-search hidden" id="newSearch">
      <button onclick="resetUI()">Start New Research</button>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
